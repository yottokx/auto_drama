[project]
name = "auto-drama-flux3-klein-runtime"
version = "0.1.0"
description = "Isolated FLUX 3 Image Klein experiment runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.15.0",
    "diffusers",
    "huggingface-hub==1.32.0",
    "pillow==12.3.0",
    "safetensors==0.8.0",
    "torch==2.10.0+cu128",
    "torchvision==0.25.0+cu128",
    "transformers==5.17.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# main on 2026-10-16; Flux3 support landed in 7ecb1e1 (2026-10-15).
diffusers = { git = "https://github.com/huggingface/diffusers.git", rev = "d42ebf9c6e0b46103b74283f5324357a67acaa04" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
