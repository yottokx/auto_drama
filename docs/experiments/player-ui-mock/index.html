<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>鑑賞画面 デザイン試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* 本体には未組み込みの単体試作。ステージ寸法は presentation.py の STAGE (960x640) に合わせている。 */
:root {
  --ink: #05070a;
  --paper: #f2f0ea;
  --dim: #a8a69f;
  --lamp: #dccba2;
  --hair: rgba(242, 240, 234, .2);
  --gothic: "Zen Kaku Gothic New", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --mincho: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
  --body-font: var(--gothic);
  --fs: 24px;
  --lh: 1.75;
  --lines: 3;
  --win-a: .8;
  --col-l: 120px;
  --col-w: 720px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #000; color: var(--paper); font-family: var(--gothic); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--lamp); outline-offset: 4px; }

#fit { position: fixed; inset: 0 0 34px; }
#stage { position: absolute; left: 50%; top: 50%; width: 960px; height: 640px; margin: -320px 0 0 -480px;
  overflow: hidden; background: #0b1017; transform-origin: center; user-select: none; cursor: default; }
#bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#portrait { position: absolute; left: 50%; top: 44px; height: 900px; transform: translateX(-50%);
  transition: filter .35s ease; pointer-events: none; }
#portrait.listening { filter: brightness(.7) saturate(.9); }

/* ── メッセージウィンドウ ── */
#win { position: absolute; left: 0; right: 0; bottom: 0; padding-top: 132px; transition: opacity .3s ease; }
#win::before { content: ""; position: absolute; inset: 0; background: var(--ink); opacity: var(--win-a);
  /* 本文と名前の領域までは一定の濃さ、その上 132px で消える */
  -webkit-mask-image: linear-gradient(to top, #000 0, #000 calc(100% - 132px), rgba(0,0,0,.8) calc(100% - 104px),
    rgba(0,0,0,.52) calc(100% - 74px), rgba(0,0,0,.26) calc(100% - 44px), rgba(0,0,0,.08) calc(100% - 18px), transparent 100%);
  mask-image: linear-gradient(to top, #000 0, #000 calc(100% - 132px), rgba(0,0,0,.8) calc(100% - 104px),
    rgba(0,0,0,.52) calc(100% - 74px), rgba(0,0,0,.26) calc(100% - 44px), rgba(0,0,0,.08) calc(100% - 18px), transparent 100%); }
#col { position: relative; margin-left: var(--col-l); width: var(--col-w); }

#namerow { display: flex; align-items: center; gap: 14px; height: 30px; }
#name { font-size: 15px; font-weight: 500; letter-spacing: .24em; color: var(--lamp); white-space: nowrap;
  text-shadow: 0 1px 2px rgba(0,0,0,.7); }
#name:empty { display: none; }
#voice { display: none; align-items: flex-end; gap: 2px; height: 10px; }
#voice.on { display: flex; }
#voice i { width: 2px; height: 100%; background: var(--lamp); opacity: .75; transform-origin: bottom;
  animation: voice 0.9s ease-in-out infinite; }
#voice i:nth-child(2) { animation-delay: -.3s; }
#voice i:nth-child(3) { animation-delay: -.6s; }
@keyframes voice { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
#rule { flex: 1; height: 1px; background: linear-gradient(to right, var(--hair), transparent 82%); }
#pages { font-size: 11px; letter-spacing: .14em; color: var(--dim); font-variant-numeric: tabular-nums; }
#pages:empty { display: none; }

#body, #measure { font-family: var(--body-font); font-size: var(--fs); line-height: var(--lh); font-weight: 500;
  letter-spacing: .02em; line-break: strict; overflow-wrap: anywhere; white-space: pre-wrap; }
#body { height: calc(var(--fs) * var(--lh) * var(--lines)); margin-top: 6px; overflow: hidden;
  text-shadow: 0 1px 2px rgba(0,0,0,.75), 0 0 10px rgba(0,0,0,.35); }
#body .rest { visibility: hidden; }
#measure { position: absolute; left: 0; top: 0; width: var(--col-w); visibility: hidden; pointer-events: none; }

/* 待機マーク: 続きのページがあるときは山形、発話の終わりは菱形 */
.mark { display: inline-block; margin-left: .45em; vertical-align: .08em; }
.mark.more { width: .36em; height: .36em; border-right: 1.5px solid var(--paper); border-bottom: 1.5px solid var(--paper);
  transform: rotate(45deg); animation: bob 1.1s ease-in-out infinite; }
.mark.end { width: .3em; height: .3em; background: var(--lamp); transform: rotate(45deg);
  animation: breathe 1.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { translate: 0 -.12em; opacity: .5; } 50% { translate: 0 .08em; opacity: 1; } }
@keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

/* ── 下部メニュー ── */
#foot { position: relative; display: flex; justify-content: flex-end; align-items: center; height: 44px;
  margin-left: var(--col-l); width: var(--col-w); }
#menu { display: flex; gap: 22px; transition: opacity .25s ease; }
#menu button { font-size: 12px; letter-spacing: .2em; color: var(--paper); opacity: .42; padding: 8px 0;
  transition: opacity .15s ease, color .15s ease; }
#menu button:hover, #menu button:focus-visible { opacity: 1; }
#mode { position: absolute; right: 0; display: none; align-items: center; gap: 9px; font-size: 12px;
  letter-spacing: .2em; color: var(--lamp); padding: 8px 0; }
#mode::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--lamp);
  animation: breathe 1.6s ease-in-out infinite; }
#stage.auto #menu, #stage.skip #menu { opacity: 0; pointer-events: none; }
#stage.auto #mode, #stage.skip #mode { display: flex; }
/* オートの待ち時間を最下辺の細線で示す */
#gauge { position: absolute; left: 0; bottom: 0; height: 1px; width: 0; background: var(--lamp); opacity: .7; }

#stage.bare #win, #stage.bare #toast, #stage:has(#log.on) #win { opacity: 0; pointer-events: none; }

#toast { position: absolute; left: 50%; top: 28px; translate: -50% -6px; font-size: 12px; letter-spacing: .16em;
  padding: 8px 18px; background: rgba(5,7,10,.72); border-radius: 2px; opacity: 0; pointer-events: none;
  transition: opacity .25s ease, translate .25s ease; white-space: nowrap; }
#toast.on { opacity: 1; translate: -50% 0; }

/* ── バックログ ── */
#log { position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(5,7,10,.84);
  -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); opacity: 0; visibility: hidden;
  transition: opacity .22s ease, visibility 0s .22s; }
#log.on { opacity: 1; visibility: visible; transition: opacity .22s ease; }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; flex: none; }
.sheet-head h2 { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .34em; color: var(--dim); }
.sheet-head button { font-size: 12px; letter-spacing: .2em; opacity: .55; padding: 6px 0; }
.sheet-head button:hover { opacity: 1; }
#log .sheet-head { margin: 30px 120px 0 var(--col-l); padding-bottom: 14px; border-bottom: 1px solid var(--hair); }
#log-list { flex: 1; overflow-y: auto; padding: 18px 0 44px; scrollbar-width: thin; scrollbar-color: rgba(242,240,234,.25) transparent;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 26px, #000 calc(100% - 40px), transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0, #000 26px, #000 calc(100% - 40px), transparent 100%); }
.entry { position: relative; display: grid; grid-template-columns: var(--col-l) var(--col-w); padding: 13px 0; }
.entry .who { padding: 7px 18px 0 12px; text-align: right; font-size: 13px; letter-spacing: .16em; color: var(--lamp); }
.entry p { margin: 0; font-family: var(--body-font); font-size: 19px; line-height: 1.85; font-weight: 500; color: rgba(242,240,234,.82); }
.entry.now p { color: var(--paper); }
.entry .acts { grid-column: 2; display: flex; gap: 22px; height: 0; overflow: hidden; opacity: 0;
  transition: height .18s ease, opacity .18s ease; }
.entry:hover .acts, .entry:focus-within .acts { height: 30px; opacity: 1; }
.entry .acts button { font-size: 12px; letter-spacing: .14em; color: var(--lamp); opacity: .8; }
.entry .acts button:hover { opacity: 1; text-decoration: underline; text-underline-offset: 5px; }
.entry.now .who::after { content: "いま"; display: block; margin-top: 4px; font-size: 10px; letter-spacing: .2em; color: var(--dim); }
@media (hover: none) { .entry .acts { height: 30px; opacity: .8; } }

/* ── 設定 ── */
#config { position: absolute; top: 0; right: 0; bottom: 0; width: 348px; padding: 30px 32px; background: rgba(5,7,10,.9);
  -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px); border-left: 1px solid var(--hair);
  translate: 100% 0; visibility: hidden; transition: translate .26s cubic-bezier(.2,.7,.2,1), visibility 0s .26s; overflow-y: auto; }
#config.on { translate: 0 0; visibility: visible; transition: translate .26s cubic-bezier(.2,.7,.2,1); }
#config .sheet-head { padding-bottom: 14px; border-bottom: 1px solid var(--hair); margin-bottom: 8px; }
.row { padding: 15px 0 3px; }
.row > span { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .16em; color: var(--dim); margin-bottom: 10px; }
.row output { color: var(--paper); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 20px; }
.seg button { font-size: 14px; letter-spacing: .1em; opacity: .45; padding: 2px 0 6px; border-bottom: 1px solid transparent; }
.seg button:hover { opacity: .8; }
.seg button[aria-pressed=true] { opacity: 1; border-bottom-color: var(--lamp); }
input[type=range] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 18px; margin: 0; background: none; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: rgba(242,240,234,.38); }
input[type=range]::-moz-range-track { height: 1px; background: rgba(242,240,234,.38); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -5px; border-radius: 50%; background: var(--lamp); }
input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--lamp); }

#hint { position: fixed; left: 0; right: 0; bottom: 0; height: 34px; margin: 0; display: flex; align-items: center; justify-content: center;
  gap: 20px; font-size: 11px; letter-spacing: .08em; color: #77756f; white-space: nowrap; overflow: hidden; }
#hint b { font-weight: 500; color: #a8a69f; margin-right: 5px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition-duration: 0s !important; }
}
</style>
</head>
<body>
<div id="fit">
<div id="stage">
  <img id="bg" src="../../../apps/web/public/demo/lighthouse.png" alt="">
  <img id="portrait" src="../../../apps/web/public/demo/nagi.png" alt="">

  <section id="win" aria-live="polite">
    <div id="col">
      <div id="namerow"><span id="name"></span><span id="voice" aria-hidden="true"><i></i><i></i><i></i></span><span id="rule"></span><span id="pages"></span></div>
      <div id="body"></div>
      <div id="measure" aria-hidden="true"></div>
    </div>
    <div id="foot">
      <nav id="menu" aria-label="鑑賞操作">
        <button id="m-auto">オート</button>
        <button id="m-save">セーブ</button>
        <button id="m-load">ロード</button>
        <button id="m-log" title="ホイール上 / ↑">ログ</button>
        <button id="m-config">設定</button>
        <button id="m-hide" title="右クリック">非表示</button>
      </nav>
      <button id="mode" aria-label="解除"><span id="mode-label">オート</span></button>
    </div>
    <div id="gauge"></div>
  </section>

  <div id="toast" role="status"></div>

  <section id="log" aria-label="バックログ">
    <div class="sheet-head"><h2>ログ</h2><button id="log-close">閉じる</button></div>
    <div id="log-list"></div>
  </section>

  <aside id="config" aria-label="設定">
    <div class="sheet-head"><h2>設定</h2><button id="config-close">閉じる</button></div>
    <div class="row"><span>文字の大きさ</span>
      <div class="seg" data-key="size"><button data-v="21">小</button><button data-v="24" aria-pressed="true">標準</button><button data-v="28">大</button></div></div>
    <div class="row"><span>書体</span>
      <div class="seg" data-key="face"><button data-v="gothic" aria-pressed="true">ゴシック</button><button data-v="mincho">明朝</button></div></div>
    <label class="row"><span>文字の速さ <output></output></span><input type="range" data-key="speed" min="0" max="100" value="62"></label>
    <label class="row"><span>オートの待ち時間 <output></output></span><input type="range" data-key="wait" min="3" max="40" value="14"></label>
    <label class="row"><span>音声の音量 <output></output></span><input type="range" data-key="voice" min="0" max="100" value="100"></label>
    <label class="row"><span>BGMの音量 <output></output></span><input type="range" data-key="bgm" min="0" max="100" value="70"></label>
    <label class="row"><span>ウィンドウの濃さ <output></output></span><input type="range" data-key="alpha" min="30" max="100" value="80"></label>
  </aside>
</div>
</div>
<p id="hint">
  <span><b>クリック / Enter</b>送り</span><span><b>右クリック</b>UI非表示</span><span><b>Ctrl 長押し</b>スキップ</span>
  <span><b>ホイール上 / ↑</b>ログ</span><span><b>Esc</b>閉じる</span><span>試作のため音声は長さだけを模擬</span>
</p>

<script>
"use strict";
const $ = id => document.getElementById(id);
const stage = $("stage"), body = $("body"), measure = $("measure"), root = document.documentElement;

const SCRIPT = [
  {who: "", text: "螺旋階段を上りきると、灯室の下の小部屋にはまだランプが点いていた。"},
  {who: "凪", text: "来たね。今夜は波が高いから、もう少し遅くなると思ってた。"},
  {who: "ユウ", text: "桟橋の板が二枚、流されてた。明日の便は着けられないかもしれない。"},
  {who: "凪", text: "そう。じゃあ先に記録を済ませてしまおう。壁の図面は祖父が引いたもので、レンズの回転周期と油の残量を毎晩ここに書き足していく決まりなんだ。面倒に見えるけど、数字が一日でも抜けると、沖の船は灯りの癖を読めなくなる。だから嵐の晩ほど、誰かがここに座って鉛筆を握っていないといけない。今夜はそれが、わたしとあなたの番というだけ。"},
  {who: "", text: "彼女は引き出しから帳面を出し、ランプの芯を少しだけ上げた。窓の外では月が雲の切れ間に出たり隠れたりして、そのたびに海の色が変わった。"},
  {who: "ユウ", text: "……書き方を教えてくれるなら。"},
  {who: "凪", text: "もちろん。まずは時刻から。秒まではいらない、分でいいよ。"},
  {who: "", text: "鉛筆の先が紙に触れる音だけが、しばらく部屋に残った。"},
];
const PORTRAIT_OF = "凪";

const st = {i: 0, page: 0, pages: [], typed: 0, phase: "typing", auto: false, skip: false,
  voiceOn: false, voiceStart: 0, voiceDur: 0, saved: null};
const cfg = {speed: 62, wait: 14};
let typeTimer, voiceTimer, autoTimer, skipTimer, toastTimer, logVoiceTimer, logOpenedAt = 0;

/* ── 改ページ: 句点で区切り、3行に収まるだけ詰める。1文で溢れる場合のみ読点、最後は文字単位 ── */
function fits(text) {
  measure.textContent = text + "　"; // 待機マークの分を確保
  const limit = parseFloat(getComputedStyle(body).height) + 1;
  return measure.scrollHeight <= limit;
}
function units(text) {
  const out = [];
  for (const sentence of text.match(/[^。！？]*[。！？]+[」』）]*|[^。！？]+$/g) || [text]) {
    if (fits(sentence)) { out.push(sentence); continue; }
    for (const clause of sentence.match(/[^、]*、|[^、]+$/g)) {
      if (fits(clause)) { out.push(clause); continue; }
      let chunk = "";
      for (const ch of clause) { if (!fits(chunk + ch)) { out.push(chunk); chunk = ""; } chunk += ch; }
      if (chunk) out.push(chunk);
    }
  }
  return out;
}
function paginate(text) {
  const pages = [];
  let current = "";
  for (const unit of units(text)) {
    if (current && !fits(current + unit)) { pages.push(current); current = ""; }
    current += unit;
  }
  if (current) pages.push(current);
  return pages;
}

/* ── 進行 ── */
function clearTimers() { clearTimeout(typeTimer); clearTimeout(autoTimer); resetGauge(); }
function stopVoice() { clearTimeout(voiceTimer); st.voiceOn = false; $("voice").classList.remove("on"); }

function startLine(index) {
  clearTimers(); stopVoice();
  st.i = index;
  const line = SCRIPT[index];
  $("name").textContent = line.who;
  $("portrait").classList.toggle("listening", line.who !== PORTRAIT_OF);
  st.pages = paginate(line.text);
  if (line.who && !st.skip) {
    st.voiceOn = true; st.voiceStart = performance.now(); st.voiceDur = line.text.length * 105;
    $("voice").classList.add("on");
    voiceTimer = setTimeout(() => { stopVoice(); if (st.phase === "speaking") toWait(); }, st.voiceDur);
  }
  showPage(0);
}
function showPage(page) {
  clearTimers();
  st.page = page; st.typed = 0; st.phase = "typing";
  $("pages").textContent = st.pages.length > 1 ? `${page + 1} / ${st.pages.length}` : "";
  body.innerHTML = '<span class="shown"></span><span class="rest"></span>';
  paint(); tick();
}
function paint() {
  const text = st.pages[st.page];
  body.firstChild.textContent = text.slice(0, st.typed);
  body.children[1].textContent = text.slice(st.typed);
}
function tick() {
  const text = st.pages[st.page], interval = Math.round(90 - cfg.speed * .86);
  if (interval <= 5 || st.skip) st.typed = text.length; else st.typed++;
  paint();
  if (st.typed < text.length) { typeTimer = setTimeout(tick, interval); return; }
  // 続きのページがある間は音声を待たない。最後のページだけ音声の終わりを待つ。
  if (st.page < st.pages.length - 1 || !st.voiceOn) toWait(); else st.phase = "speaking";
}
function toWait() {
  clearTimeout(typeTimer);
  st.typed = st.pages[st.page].length; paint();
  st.phase = "wait";
  if (!body.querySelector(".mark")) {
    const mark = document.createElement("span");
    mark.className = "mark " + (st.page < st.pages.length - 1 ? "more" : "end");
    body.firstChild.after(mark);
  }
  if (st.auto) scheduleAuto();
}
function advance() {
  if (st.phase !== "wait") { toWait(); return; } // 待機マークが出るまでは待機状態へ移るだけ
  if (st.page < st.pages.length - 1) { showPage(st.page + 1); return; }
  if (st.i >= SCRIPT.length - 1) { setAuto(false); toast("試作はここまでです。ログから戻れます"); return; }
  startLine(st.i + 1);
}

/* ── オート / スキップ ── */
function resetGauge() { const g = $("gauge"); g.style.transition = "none"; g.style.width = "0"; }
function scheduleAuto() {
  clearTimeout(autoTimer);
  let delay = cfg.wait * 100;
  if (st.page < st.pages.length - 1 && st.voiceOn) {
    // 音声の長さを文字数で按分して、読み上げ位置に合わせてめくる
    const done = st.pages.slice(0, st.page + 1).join("").length / SCRIPT[st.i].text.length;
    delay = Math.max(300, st.voiceDur * done - (performance.now() - st.voiceStart));
  }
  const g = $("gauge");
  resetGauge(); void g.offsetWidth;
  g.style.transition = `width ${delay}ms linear`; g.style.width = "100%";
  autoTimer = setTimeout(advance, delay);
}
function setAuto(on) {
  st.auto = on; stage.classList.toggle("auto", on);
  $("mode-label").textContent = "オート";
  clearTimeout(autoTimer); resetGauge();
  if (on && st.phase === "wait") scheduleAuto();
}
function setSkip(on) {
  if (on === st.skip) return;
  if (on && (overlayOpen() || stage.classList.contains("bare"))) return;
  if (on) setAuto(false);
  st.skip = on; stage.classList.toggle("skip", on);
  $("mode-label").textContent = on ? "スキップ" : "オート";
  clearInterval(skipTimer);
  if (on) { stopVoice(); skipTimer = setInterval(() => {
    if (st.i >= SCRIPT.length - 1 && st.page >= st.pages.length - 1 && st.phase === "wait") { setSkip(false); return; }
    advance(); if (st.phase !== "wait") toWait();
  }, 80); }
}

/* ── バックログ ── */
function openLog() {
  if (overlayOpen()) return;
  setAuto(false); stopVoice();
  if (st.phase !== "wait") toWait(); // 閉じたら待機状態から再開する
  const list = $("log-list"); list.textContent = "";
  SCRIPT.slice(0, st.i + 1).forEach((line, index) => {
    const entry = document.createElement("article");
    entry.className = "entry" + (index === st.i ? " now" : "");
    const who = document.createElement("div"); who.className = "who"; who.textContent = line.who;
    const text = document.createElement("p"); text.textContent = line.text;
    const acts = document.createElement("div"); acts.className = "acts";
    if (line.who) {
      const play = document.createElement("button"); play.textContent = "音声を聴く";
      play.onclick = () => {
        const playing = play.dataset.on; resetLogVoice();
        if (playing) return;
        play.dataset.on = "1"; play.textContent = "止める";
        logVoiceTimer = setTimeout(resetLogVoice, line.text.length * 105);
      };
      acts.append(play);
    }
    if (index !== st.i) {
      const back = document.createElement("button"); back.textContent = "ここへ戻る";
      back.onclick = () => { closeLog(); startLine(index); };
      acts.append(back);
    }
    entry.append(who, text, acts); list.append(entry);
  });
  $("log").classList.add("on"); logOpenedAt = performance.now();
  list.scrollTop = list.scrollHeight;
}
function resetLogVoice() {
  clearTimeout(logVoiceTimer);
  $("log-list").querySelectorAll("button[data-on]").forEach(b => { delete b.dataset.on; b.textContent = "音声を聴く"; });
}
function closeLog() { resetLogVoice(); $("log").classList.remove("on"); }
const overlayOpen = () => $("log").classList.contains("on") || $("config").classList.contains("on");

/* ── 設定 ── */
function applyRange(input) {
  const value = Number(input.value), out = input.closest(".row").querySelector("output");
  switch (input.dataset.key) {
    case "speed": cfg.speed = value; out.textContent = value >= 98 ? "一括" : value; break;
    case "wait": cfg.wait = value; out.textContent = (value / 10).toFixed(1) + " 秒"; break;
    case "alpha": root.style.setProperty("--win-a", value / 100); out.textContent = value + "%"; break;
    default: out.textContent = value;
  }
}
document.querySelectorAll("#config input[type=range]").forEach(input => {
  applyRange(input); input.addEventListener("input", () => applyRange(input));
});
document.querySelectorAll("#config .seg").forEach(seg => seg.addEventListener("click", event => {
  const button = event.target.closest("button"); if (!button) return;
  seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === button)));
  if (seg.dataset.key === "size") root.style.setProperty("--fs", button.dataset.v + "px");
  else root.style.setProperty("--body-font", `var(--${button.dataset.v})`);
  stopVoice(); startLine(st.i); toWait(); // 行送りが変わるのでページを組み直す
}));
function openConfig() { if (overlayOpen()) return; setAuto(false); $("config").classList.add("on"); }
function closeConfig() { $("config").classList.remove("on"); }

function toast(message) {
  const el = $("toast"); el.textContent = message; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 1800);
}

/* ── 入力 ── */
$("m-auto").onclick = () => setAuto(true);
$("mode").onclick = () => { setAuto(false); };
$("m-save").onclick = () => { st.saved = st.i; toast("セーブしました"); };
$("m-load").onclick = () => {
  if (st.saved === null) { toast("セーブした場面がありません"); return; }
  startLine(st.saved); toast("ロードしました");
};
$("m-log").onclick = openLog;
$("m-config").onclick = openConfig;
$("m-hide").onclick = () => stage.classList.add("bare");
$("log-close").onclick = closeLog;
$("config-close").onclick = closeConfig;

stage.addEventListener("click", event => {
  if (stage.classList.contains("bare")) { stage.classList.remove("bare"); return; } // 戻すだけで送らない
  if (event.target.closest("#menu, #mode, #log, #config")) return;
  if ($("config").classList.contains("on")) { closeConfig(); return; }
  if (st.auto) { setAuto(false); return; }
  advance();
});
stage.addEventListener("contextmenu", event => {
  event.preventDefault();
  if ($("log").classList.contains("on")) closeLog();
  else if ($("config").classList.contains("on")) closeConfig();
  else { setAuto(false); stage.classList.toggle("bare"); }
});
stage.addEventListener("wheel", event => {
  event.preventDefault();
  if ($("config").classList.contains("on")) return;
  if (!$("log").classList.contains("on")) { if (event.deltaY < 0 && !stage.classList.contains("bare")) openLog(); return; }
  const list = $("log-list");
  list.scrollTop += event.deltaY;
  // 最下部でさらに下へ回すと閉じる
  if (event.deltaY > 0 && performance.now() - logOpenedAt > 350 &&
      list.scrollTop + list.clientHeight >= list.scrollHeight - 1 && event.deltaY > 0 && list.dataset.atEnd) closeLog();
  list.dataset.atEnd = list.scrollTop + list.clientHeight >= list.scrollHeight - 1 ? "1" : "";
}, {passive: false});
document.addEventListener("keydown", event => {
  if (event.key === "Control") { setSkip(true); return; }
  if (event.repeat) return;
  if (event.key === "Escape") {
    if ($("log").classList.contains("on")) closeLog();
    else if ($("config").classList.contains("on")) closeConfig();
    else if (stage.classList.contains("bare")) stage.classList.remove("bare");
    else setAuto(false);
  } else if ((event.key === "ArrowUp" || event.key === "PageUp") && !stage.classList.contains("bare")) {
    openLog();
  } else if ((event.key === "Enter" || event.key === " ") && !event.target.closest("button, input")) {
    event.preventDefault(); stage.click();
  }
});
document.addEventListener("keyup", event => { if (event.key === "Control") setSkip(false); });
window.addEventListener("blur", () => setSkip(false));

function fit() {
  const box = $("fit").getBoundingClientRect();
  stage.style.transform = `scale(${Math.min(box.width / 960, box.height / 640)})`;
}
window.addEventListener("resize", fit);
fit();
(document.fonts?.ready || Promise.resolve()).then(() => startLine(0));
</script>
</body>
</html>
